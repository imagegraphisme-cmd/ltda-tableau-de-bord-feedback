<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTDA Dashboard PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .dot-vital { background-color: #ef4444; }
        .dot-important { background-color: #f97316; }
        .dot-ok { background-color: #3b82f6; }
        .dot-solved { background-color: #22c55e; }

        .bug-row { border-bottom: 1px solid #f1f5f9; transition: all 0.2s; }
        .bug-row:hover { background-color: #f1f5f9; transform: translateX(4px); }
        
        .tab-active { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; }
        
        #overlay { transition: transform 0.3s ease-in-out; transform: translateX(100%); z-index: 200; }
        #overlay.active { transform: translateX(0); }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <div id="view-landing" class="fixed inset-0 z-[300] flex items-center justify-center bg-slate-50 p-6">
        <div class="bg-white p-12 rounded-[2rem] shadow-2xl max-w-md w-full text-center space-y-8 border border-slate-200">
            <h1 class="text-4xl font-black uppercase tracking-tighter text-blue-600 italic">LTDA</h1>
            <select id="initialProjectSelect" class="w-full border-2 border-slate-100 rounded-2xl p-4 focus:border-blue-500 outline-none font-bold bg-slate-50 appearance-none text-center">
                <option value="">Connexion au serveur...</option>
            </select>
            <button onclick="enterDashboard()" id="btn-enter" disabled class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 transition-all opacity-50 cursor-not-allowed uppercase tracking-widest shadow-xl">Entrer</button>
        </div>
    </div>

    <div id="view-dashboard" class="hidden flex flex-col min-h-screen">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 p-4 md:px-8 flex justify-between items-center h-16">
            <div class="flex items-center gap-4">
                <h2 id="currentProjectTitle" class="text-lg font-black uppercase tracking-tighter italic">Projet</h2>
                <button onclick="location.reload()" class="text-[9px] font-black uppercase text-slate-400 hover:text-blue-600">← Changer</button>
            </div>
            <button onclick="toggleOverlay(true)" class="bg-blue-600 text-white px-6 py-2.5 rounded-full font-black text-xs uppercase tracking-widest hover:bg-blue-700 transition-all">+ Nouveau Retour</button>
        </header>

        <div class="flex flex-1">
            <aside class="w-64 bg-white border-r border-slate-200 sticky top-16 h-[calc(100vh-4rem)] p-4 hidden md:block">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6 px-4">Breakpoints</p>
                <nav id="breakpointTabs" class="space-y-1">
                    <button onclick="filterByBreakpoint('all')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-bold transition-all tab-active" id="tab-all">Toutes les vues</button>
                    </nav>
                
                <div class="mt-10 pt-10 border-t border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 px-4">Tri</p>
                    <select id="sortSelect" onchange="renderBugList()" class="w-full bg-slate-50 border-0 rounded-xl p-3 text-xs font-bold outline-none">
                        <option value="ID">Chronologique</option>
                        <option value="impact">Par Impact</option>
                        <option value="State">Par État</option>
                    </select>
                </div>
            </aside>

            <main class="flex-1 bg-white">
                <div id="bugListContainer" class="flex flex-col">
                    </div>
            </main>
        </div>
    </div>

    <div id="overlay-bg" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[150] hidden opacity-0 transition-opacity" onclick="toggleOverlay(false)"></div>
    <div id="overlay" class="fixed top-0 right-0 h-full w-full max-w-xl bg-white z-[200] shadow-2xl overflow-y-auto p-8 md:p-12">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-black uppercase tracking-tighter italic">Nouveau Rapport</h2>
            <button onclick="toggleOverlay(false)" class="text-slate-300 text-4xl hover:text-black">&times;</button>
        </div>
        <form id="bugForm" class="space-y-6 pb-10">
            <div id="formContent" class="space-y-6"></div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 shadow-xl transition-all uppercase tracking-widest">Envoyer à l'équipe</button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZwfqSEos8tgh_d9K04mJ9zIhP2KW1cSiLxvpuartTHluArZa6dOALIEiyHcuXTya-/exec";
        let store = { projects: [], config: {}, bugs: [] };
        let activeProject = null;
        let currentFilter = 'all';

        const IMPACT_MAP = { "Vital": 4, "Important": 3, "OK": 2, "Optimisation": 1 };
        const ICONS = { "Widescreen": "🖥️", "Desktop": "💻", "Tablet": "📟", "Mobile (L)": "📱", "Mobile (V)": "🤳" };

        function getDriveThumb(url) {
            if (!url || url === "No Image") return null;
            let id = "";
            if (url.includes('id=')) id = url.split('id=')[1].split('&')[0];
            else if (url.includes('/d/')) id = url.split('/d/')[1].split('/')[0];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w200` : null;
        }

        async function init() {
            try {
                const resp = await fetch(SCRIPT_URL);
                store = await resp.json();
                const select = document.getElementById('initialProjectSelect');
                select.innerHTML = '<option value="">Choisir Projet...</option>' + 
                    store.projects.map(p => `<option value="${p.name}">${p.client} — ${p.name}</option>`).join('');
                document.getElementById('btn-enter').disabled = false;
                document.getElementById('btn-enter').classList.remove('opacity-50', 'cursor-not-allowed');
                
                // Générer les tabs de breakpoints
                const tabs = document.getElementById('breakpointTabs');
                store.config.breakpoints.forEach(bp => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-4 py-3 rounded-xl text-sm font-bold transition-all text-slate-500 hover:bg-slate-50";
                    btn.id = `tab-${bp}`;
                    btn.innerHTML = `${ICONS[bp] || '🌐'} ${bp}`;
                    btn.onclick = () => filterByBreakpoint(bp);
                    tabs.appendChild(btn);
                });
            } catch (err) { console.error(err); }
        }

        function filterByBreakpoint(bp) {
            currentFilter = bp;
            document.querySelectorAll('#breakpointTabs button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab-${bp}`).classList.add('tab-active');
            renderBugList();
        }

        function enterDashboard() {
            const pName = document.getElementById('initialProjectSelect').value;
            if (!pName) return;
            activeProject = store.projects.find(p => p.name === pName);
            document.getElementById('view-landing').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('currentProjectTitle').innerText = activeProject.name;
            renderBugList();
        }

        function renderBugList() {
            const container = document.getElementById('bugListContainer');
            const sortBy = document.getElementById('sortSelect').value;
            
            // Filtrage par projet ET par breakpoint (si sélectionné)
            let projectBugs = (store.bugs || []).filter(b => b.Project === activeProject.name);
            if (currentFilter !== 'all') {
                projectBugs = projectBugs.filter(b => b.Breakpoint && b.Breakpoint.includes(currentFilter));
            }
            
            // Tri Chronologique par défaut (Basé sur l'ID car reverse est déjà fait par le script)
            projectBugs.sort((a, b) => {
                if (sortBy === 'impact') return (IMPACT_MAP[b.Impact] || 0) - (IMPACT_MAP[a.Impact] || 0);
                if (sortBy === 'ID') return b.ID.localeCompare(a.ID);
                return String(b[sortBy]).localeCompare(String(a[sortBy]));
            });

            container.innerHTML = projectBugs.map(bug => {
                const isSolved = bug.State === 'Solved';
                const dotClass = isSolved ? 'dot-solved' : 'dot-' + (bug.Impact || "ok").toLowerCase().split(' ')[0];
                const thumb = getDriveThumb(bug['Screenshot URL']);
                const bpIcons = (bug.Breakpoint || "").split(',').map(bp => ICONS[bp.trim()] || "").join('');
                
                // On sécurise l'affichage de l'heure
                const timeDisplay = bug.Timestamp || bug.timestamp || "--:--";

                return `
                    <div class="bug-row p-4 flex items-center gap-5 ${isSolved ? 'opacity-40 grayscale' : ''}">
                        <div class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${dotClass}"></div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-3 mb-1">
                                <span class="mono text-[10px] font-bold text-slate-400 uppercase">${bug.ID}</span>
                                <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded uppercase tracking-tighter">${bug.Location}</span>
                                <span class="text-[10px] text-slate-400 font-bold ml-auto">${timeDisplay}</span>
                            </div>
                            <p class="text-sm font-bold text-slate-700 leading-tight truncate" title="${bug.Note}">${bug.Note || 'Sans description'}</p>
                        </div>
                        <div class="flex items-center gap-4 flex-shrink-0">
                            <div class="text-lg flex gap-1 opacity-80">${bpIcons}</div>
                            ${thumb ? `
                                <a href="${bug['Screenshot URL']}" target="_blank" class="w-10 h-10 rounded-lg overflow-hidden border border-slate-200 hover:scale-110 transition-all">
                                    <img src="${thumb}" class="w-full h-full object-cover">
                                </a>
                            ` : `<div class="w-10 h-10 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-[10px] text-slate-300">∅</div>`}
                            <div class="flex gap-1">
                                <button onclick="solveBug('${bug.ID}')" class="p-2 text-slate-300 hover:text-green-500 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                                <button onclick="deleteBug('${bug.ID}')" class="p-2 text-slate-300 hover:text-red-500 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function solveBug(id) {
            const bug = store.bugs.find(b => b.ID === id);
            if (bug) bug.State = "Solved";
            renderBugList();
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "update_bug", id: id, newState: "Solved" }) });
        }

        async function deleteBug(id) {
            if(!confirm("Supprimer ?")) return;
            store.bugs = store.bugs.filter(b => b.ID !== id);
            renderBugList();
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete_bug", id: id }) });
        }

        function toggleOverlay(show) {
            const overlay = document.getElementById('overlay');
            const bg = document.getElementById('overlay-bg');
            if (show) {
                renderFormFields();
                bg.classList.remove('hidden');
                setTimeout(() => { overlay.classList.add('active'); bg.classList.add('opacity-100'); }, 10);
            } else {
                overlay.classList.remove('active'); bg.classList.remove('opacity-100');
                setTimeout(() => bg.classList.add('hidden'), 300);
            }
        }

        function renderFormFields() {
            document.getElementById('formContent').innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Impact</label>
                        <select id="impactSelect" class="w-full border-2 p-3 rounded-xl font-bold bg-slate-50">${store.config.impacts.map(i => `<option>${i}</option>`).join('')}</select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-400">Priorité</label>
                        <select id="prioritySelect" class="w-full border-2 p-3 rounded-xl font-bold bg-slate-50">${store.config.priorities.map(p => `<option>${p}</option>`).join('')}</select>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-slate-400">Zone</label>
                    <div class="grid grid-cols-2 gap-2">${activeProject.composition.map(c => `
                        <label class="flex items-center gap-2 p-2.5 border-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-slate-50 has-[:checked]:bg-blue-50">
                            <input type="checkbox" name="location" value="${c}" class="w-4 h-4 text-blue-600"> ${c}
                        </label>
                    `).join('')}</div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-slate-400">Breakpoints</label>
                    <div class="flex flex-wrap gap-2">${store.config.breakpoints.map(b => `
                        <label class="flex items-center gap-2 p-2 border-2 rounded-xl text-[10px] font-black uppercase cursor-pointer hover:bg-slate-50 has-[:checked]:bg-slate-900 has-[:checked]:text-white transition-all">
                            <input type="checkbox" name="breakpoint" value="${b}" class="hidden"> ${ICONS[b] || ''} ${b}
                        </label>
                    `).join('')}</div>
                </div>
                <textarea id="bugNote" class="w-full border-2 p-4 rounded-2xl h-24 focus:border-blue-500 outline-none bg-slate-50 font-medium" placeholder="Détails du problème..."></textarea>
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-slate-400">Capture</label>
                    <input type="file" id="screenshot" accept="image/*" class="w-full border-2 border-dashed p-4 rounded-xl text-xs">
                </div>
                <div class="flex gap-2">${["Client", "Collaborateur", "LTDA"].map(n => `
                    <label class="flex-1 text-center p-3 border-2 rounded-xl text-[10px] font-black uppercase cursor-pointer has-[:checked]:bg-blue-600 has-[:checked]:text-white transition-all">
                        <input type="radio" name="noticedBy" value="${n}" class="hidden" required> ${n}
                    </label>
                `).join('')}</div>
            `;
        }

        document.getElementById('bugForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('screenshot');
            btn.disabled = true;
            btn.innerText = "Synchronisation...";

            const dateStr = new Date().toLocaleDateString('fr-FR');
            const timeStr = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            
            const tempBug = {
                ID: "LTDA-...",
                Project: activeProject.name,
                Note: document.getElementById('bugNote').value,
                Location: Array.from(document.querySelectorAll('input[name="location"]:checked')).map(el => el.value).join(', '),
                Breakpoint: Array.from(document.querySelectorAll('input[name="breakpoint"]:checked')).map(el => el.value).join(', '),
                Impact: document.getElementById('impactSelect').value,
                Priority: document.getElementById('prioritySelect').value,
                Timestamp: timeStr,
                "Noticed By": document.querySelector('input[name="noticedBy"]:checked').value,
                State: "Not solved"
            };

            store.bugs.unshift(tempBug);
            renderBugList();
            toggleOverlay(false);

            let imageBlob = null;
            if (fileInput.files.length > 0) {
                imageBlob = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = () => r(reader.result);
                    reader.readAsDataURL(fileInput.files[0]);
                });
            }

            const payload = {
                action: "log_bug",
                dateNoticed: dateStr,
                client: activeProject.client, project: activeProject.name,
                impact: tempBug.Impact, priority: tempBug.Priority,
                location: tempBug.Location, breakpoints: tempBug.Breakpoint,
                note: tempBug.Note, noticedBy: tempBug["Noticed By"],
                imageBlob: imageBlob, imageType: fileInput.files[0]?.type, imageName: fileInput.files[0]?.name
            };

            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if(result.status === "success") {
                    tempBug.ID = result.id;
                    renderBugList();
                }
            } catch(e) { console.log("Sync background ok"); }

            btn.disabled = false;
        };

        init();
    </script>
</body>
</html>
