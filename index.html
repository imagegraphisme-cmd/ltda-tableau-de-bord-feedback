<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTDA Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .impact-vital { border-left: 8px solid #ef4444 !important; background: #fff1f2; }
        .impact-important { border-left: 8px solid #f97316 !important; background: #fff7ed; }
        .state-solved { opacity: 0.5; filter: grayscale(0.8); border-left: 8px solid #22c55e !important; }
        #overlay { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #overlay.active { transform: translateX(0); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-900">

    <div id="view-landing" class="flex items-center justify-center min-h-screen p-6">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100 max-w-md w-full text-center space-y-8">
            <h1 class="text-4xl font-black uppercase tracking-tighter italic text-blue-600">LTDA</h1>
            <select id="initialProjectSelect" class="w-full border-2 border-slate-100 rounded-2xl p-5 focus:border-blue-500 outline-none appearance-none bg-slate-50 font-bold text-center text-lg"></select>
            <button onclick="enterDashboard()" id="btn-enter" disabled class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 transition-all opacity-50 cursor-not-allowed shadow-xl shadow-blue-200 uppercase tracking-widest">Accéder au suivi</button>
        </div>
    </div>

    <div id="view-dashboard" class="hidden">
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 p-4 md:px-10 flex justify-between items-center">
            <div>
                <h2 id="currentProjectTitle" class="text-2xl font-black uppercase tracking-tighter">Projet</h2>
                <div class="flex gap-4 text-[10px] font-black uppercase tracking-widest text-slate-400">
                    <button onclick="location.reload()" class="hover:text-blue-600">← Changer</button>
                    <span id="stats-counter">0 Observations</span>
                </div>
            </div>
            <button onclick="toggleOverlay(true)" class="bg-blue-600 text-white px-8 py-4 rounded-full font-black text-xs uppercase tracking-widest hover:scale-105 transition-all shadow-lg shadow-blue-200">
                + Observation
            </button>
        </header>

        <main class="max-w-5xl mx-auto p-6 md:p-10 space-y-4" id="bugListContainer"></main>
    </div>

    <div id="overlay-bg" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[90] hidden opacity-0 transition-opacity" onclick="toggleOverlay(false)"></div>
    <div id="overlay" class="fixed top-0 right-0 h-full w-full max-w-xl bg-white shadow-2xl overflow-y-auto z-[100] p-8 md:p-12">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-black uppercase tracking-tighter">Nouveau Retour</h2>
            <button onclick="toggleOverlay(false)" class="text-slate-300 text-4xl hover:text-black">&times;</button>
        </div>
        <form id="bugForm" class="space-y-8">
            <div id="formContent" class="space-y-8"></div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-black py-6 rounded-3xl hover:bg-blue-700 shadow-2xl transition-all uppercase tracking-widest">Enregistrer l'observation</button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZwfqSEos8tgh_d9K04mJ9zIhP2KW1cSiLxvpuartTHluArZa6dOALIEiyHcuXTya-/exec";
        let store = { projects: [], config: {}, bugs: [] };
        let activeProject = null;

        const IMPACT_SCORE = { "Vital": 3, "Important": 2, "OK": 1, "Optimisation": 0 };

        async function init() {
            const resp = await fetch(SCRIPT_URL);
            store = await resp.json();
            const select = document.getElementById('initialProjectSelect');
            select.innerHTML = '<option value="">Sélectionner Projet</option>' + 
                store.projects.map(p => `<option value="${p.name}">${p.client} — ${p.name}</option>`).join('');
            document.getElementById('btn-enter').disabled = false;
            document.getElementById('btn-enter').classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function enterDashboard() {
            activeProject = store.projects.find(p => p.name === document.getElementById('initialProjectSelect').value);
            document.getElementById('view-landing').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('currentProjectTitle').innerText = activeProject.name;
            renderBugList();
        }

        function renderBugList() {
            const container = document.getElementById('bugListContainer');
            const projectBugs = (store.bugs || []).filter(b => b.Project === activeProject.name);
            
            // SORTING LOGIC: Impact first, then Date
            projectBugs.sort((a, b) => (IMPACT_SCORE[b.Impact] || 0) - (IMPACT_SCORE[a.Impact] || 0));

            document.getElementById('stats-counter').innerText = projectBugs.length + " Observations";

            container.innerHTML = projectBugs.map(bug => {
                const isSolved = bug.State === 'Solved' || bug.State === 'Obsolete';
                const impactClass = isSolved ? 'state-solved' : 'impact-' + (bug.Impact || "").toLowerCase().split(' ')[0];
                
                return `
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 p-6 transition-all hover:shadow-xl ${impactClass}">
                        <div class="flex justify-between items-start gap-6">
                            <div class="flex-1 space-y-3">
                                <div class="flex items-center gap-3">
                                    <span class="px-3 py-1 rounded-full bg-slate-900 text-white text-[9px] font-black uppercase">${bug.ID}</span>
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">${bug['Date Noticed']}</span>
                                    <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase">${bug.Location}</span>
                                </div>
                                <p class="text-slate-900 font-bold text-xl leading-tight">${bug.Note || 'Sans note'}</p>
                                
                                <details class="group">
                                    <summary class="list-none text-[10px] font-black text-slate-300 uppercase cursor-pointer hover:text-blue-600 transition-colors tracking-widest">Voir détails +</summary>
                                    <div class="pt-4 grid grid-cols-2 gap-4 text-xs border-t mt-4 border-slate-50">
                                        <div><span class="text-slate-400 font-bold uppercase block text-[8px]">Breakpoint</span>${bug.Breakpoint}</div>
                                        <div><span class="text-slate-400 font-bold uppercase block text-[8px]">Impact</span>${bug.Impact}</div>
                                        <div><span class="text-slate-400 font-bold uppercase block text-[8px]">Priorité</span>${bug.Priority}</div>
                                        <div><span class="text-slate-400 font-bold uppercase block text-[8px]">État</span>${bug.State}</div>
                                    </div>
                                </details>
                            </div>

                            <div class="flex flex-col gap-2">
                                ${!isSolved ? `<button onclick="updateState('${bug.ID}', 'Solved')" class="bg-green-500 text-white p-3 rounded-2xl text-[10px] font-black uppercase hover:bg-green-600 transition-all shadow-lg shadow-green-100">Fixé</button>` : ''}
                                ${bug['Screenshot URL'] && bug['Screenshot URL'] !== 'No Image' ? `
                                    <a href="${bug['Screenshot URL']}" target="_blank" class="w-16 h-16 rounded-2xl overflow-hidden border border-slate-100 block">
                                        <img src="${bug['Screenshot URL']}" class="w-full h-full object-cover">
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateState(id, newState) {
            const bug = store.bugs.find(b => b.ID === id);
            if (bug) bug.State = newState;
            renderBugList(); // Instant UI update
            
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: "update_bug", id: id, newState: newState })
            });
        }

        function toggleOverlay(show) {
            const overlay = document.getElementById('overlay');
            const bg = document.getElementById('overlay-bg');
            if (show) {
                renderFormFields();
                bg.classList.remove('hidden');
                setTimeout(() => { overlay.classList.add('active'); bg.classList.add('opacity-100'); }, 10);
            } else {
                overlay.classList.remove('active'); bg.classList.remove('opacity-100');
                setTimeout(() => bg.classList.add('hidden'), 300);
            }
        }

        function renderFormFields() {
            document.getElementById('formContent').innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400">Impact</label>
                        <select id="impactSelect" class="w-full border-2 p-4 rounded-2xl font-bold bg-slate-50">${store.config.impacts.map(i => `<option>${i}</option>`).join('')}</select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-400">Priorité</label>
                        <select id="prioritySelect" class="w-full border-2 p-4 rounded-2xl font-bold bg-slate-50">${store.config.priorities.map(p => `<option>${p}</option>`).join('')}</select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400">Zone</label>
                    <div class="grid grid-cols-2 gap-2">${activeProject.composition.map(c => `
                        <label class="flex items-center gap-2 p-4 border-2 rounded-2xl text-xs font-bold cursor-pointer hover:bg-slate-50">
                            <input type="checkbox" name="location" value="${c}" class="w-4 h-4 text-blue-600"> ${c}
                        </label>
                    `).join('')}</div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400">Note</label>
                    <textarea id="bugNote" class="w-full border-2 p-5 rounded-3xl h-32 outline-none focus:border-blue-500" placeholder="Description..."></textarea>
                </div>
            `;
        }

        document.getElementById('bugForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Synchronisation...";

            const payload = {
                action: "log_bug",
                dateNoticed: new Date().toLocaleDateString('fr-FR'),
                client: activeProject.client,
                project: activeProject.name,
                impact: document.getElementById('impactSelect').value,
                priority: document.getElementById('prioritySelect').value,
                location: Array.from(document.querySelectorAll('input[name="location"]:checked')).map(el => el.value).join(', '),
                note: document.getElementById('bugNote').value,
                noticedBy: "Collaborateur",
                breakpoints: "Desktop",
                imageBlob: null
            };

            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            
            // SPEED FIX: Manually update local store and UI instead of reloading
            store.bugs.unshift({
                ...payload,
                ID: "LTDA-NEW",
                State: "Not solved",
                'Date Noticed': payload.dateNoticed,
                'Location': payload.location
            });
            
            toggleOverlay(false);
            renderBugList();
            btn.disabled = false;
            btn.innerText = "Enregistrer l'observation";
        };

        init();
    </script>
</body>
</html>
