<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Suivi Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap');
        * { font-family: 'Inter', sans-serif; font-style: normal !important; }
        .label-track { text-transform: uppercase; letter-spacing: 0.12em; font-size: 9px; font-weight: 700; color: #94a3b8; }
        .tab-active { background-color: #f8fafc; color: #6432c9; font-weight: 700; border-left: 3px solid #6432c9; }
        #overlay { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); z-index: 200; }
        #overlay.active { transform: translateX(0); }
        .thumb-zoom { transition: transform 0.2s ease-in-out; cursor: zoom-in; object-fit: cover; border-radius: 6px; border: 1px solid #f1f5f9; width: 100%; height: 100%; }
        .thumb-zoom:hover { transform: scale(7); z-index: 100; box-shadow: 0 20px 25px rgba(0,0,0,0.15); border-radius: 2px; }
    </style>
</head>
<body class="bg-white text-slate-900 overflow-x-hidden">

    <div id="view-landing" class="fixed inset-0 z-[300] flex items-center justify-center bg-[#fdfdff] p-6 text-center">
        <div class="bg-white p-12 rounded-[2.5rem] shadow-xl border border-slate-50 max-w-sm w-full space-y-10">
            <div class="flex justify-center h-32">
                <svg viewBox="0 0 260.3 260.3" class="h-full w-auto">
                    <circle fill="#6432c9" cx="130.15" cy="130.15" r="130.15"/><path fill="#fff" d="M76.32,52.74l18.62,5.9-13.32,42.04,22.39,7.09-4.57,14.41-41.01-12.99,17.89-56.45Z"/><path fill="#fff" d="M161.18,82.74l-13.17,7.61-7.57-13.09,43.01-24.86,7.57,13.09-13.17,7.61,22.07,38.18-16.67,9.64-22.07-38.18Z"/><path fill="#fff" d="M53.02,147.22l24.15-7.2c20.1-5.99,33.43.93,38.88,19.21,5.71,19.15-1.44,31.42-20.32,37.05l-25.79,7.69-16.91-56.75ZM91.42,182.17c6.12-1.83,9.2-7.25,6.17-17.43-3.01-10.09-8.79-12.78-15.17-10.88l-6.64,1.98,8.48,28.46,7.16-2.13Z"/><path fill="#fff" d="M177.09,192.81l-19.06-.95-3.58,10.45-19.33-.96,24.25-58.08,24.81,1.24,18.35,60.21-22.92-1.14-2.53-10.76ZM174.71,182.69l-5.35-22.88h-.27s-7.69,22.22-7.69,22.22l13.3.66Z"/><path fill="#fff" d="M146.01,124.39c-4.53-1.77-6.97-.68-8.44,2.71l-.18.41,5.53,2.41-6.28,14.44-14.61-6.35,4.31-9.9c5.24-12.05,12.9-14.31,22.58-10.39l-2.91,6.68Z"/>
                </svg>
            </div>
            <div class="space-y-4">
                <h1 class="text-xs font-bold uppercase tracking-widest text-slate-500">Dashboard Suivi Web (Agence)</h1>
                <select id="initialProjectSelect" class="w-full border border-slate-200 rounded-xl p-4 font-semibold text-xs bg-slate-50 outline-none appearance-none text-center cursor-pointer"></select>
                <button onclick="enterDashboard()" id="btn-enter" disabled class="w-full bg-[#6432c9] text-white font-bold py-4 rounded-xl hover:bg-black transition-all opacity-50 cursor-not-allowed uppercase text-[10px] tracking-widest shadow-lg">Ouvrir le projet</button>
            </div>
        </div>
    </div>

    <div id="view-dashboard" class="hidden flex flex-col min-h-screen">
        <header class="bg-white border-b border-slate-100 sticky top-0 z-30 px-8 h-16 flex justify-between items-center">
            <div class="flex items-center gap-8">
                <h2 id="currentProjectTitle" class="text-lg font-bold uppercase tracking-tighter">Projet</h2>
                <select id="sortSelect" onchange="renderBugList()" class="bg-slate-50 border border-slate-100 text-[9px] font-bold uppercase label-track rounded-lg px-3 py-1.5 outline-none cursor-pointer">
                    <option value="id">Chrono</option>
                    <option value="Impact">Impact</option>
                </select>
            </div>
            <button onclick="toggleOverlay(true)" class="bg-[#6432c9] text-white px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-black transition-all shadow-md">+ Nouveau</button>
        </header>

        <div class="flex flex-1">
            <aside class="w-64 bg-white border-r border-slate-100 sticky top-16 h-[calc(100vh-4rem)] p-4 hidden md:block">
                <p class="label-track mb-3 px-4">Breakpoints</p>
                <nav id="breakpointTabs" class="space-y-0.5">
                    <button onclick="filterByBreakpoint('all')" class="w-full text-left px-4 py-2.5 rounded-lg text-[10px] font-bold uppercase tracking-widest tab-active" id="tab-all">Toutes les vues</button>
                </nav>
            </aside>
            <main class="flex-1 bg-white" id="bugListContainer"></main>
        </div>
    </div>

    <div id="overlay-bg" class="fixed inset-0 bg-slate-900/10 backdrop-blur-sm z-[150] hidden opacity-0 transition-opacity" onclick="toggleOverlay(false)"></div>
    <div id="overlay" class="fixed top-0 right-0 h-full w-full max-w-lg bg-white z-[200] shadow-2xl overflow-y-auto p-10">
        <div class="flex justify-between items-center mb-8"><h2 id="formTitle" class="text-xl font-bold uppercase tracking-tighter">Nouveau Rapport</h2><button onclick="toggleOverlay(false)" class="text-slate-200 text-4xl hover:text-black">&times;</button></div>
        <form id="bugForm" class="space-y-6 pb-10"><div id="formContent" class="space-y-6"></div><button type="submit" id="submitBtn" class="w-full bg-[#6432c9] text-white font-bold py-5 rounded-2xl hover:bg-black transition-all text-[11px] uppercase tracking-widest shadow-lg">Confirmer</button></form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZwfqSEos8tgh_d9K04mJ9zIhP2KW1cSiLxvpuartTHluArZa6dOALIEiyHcuXTya-/exec";
        let store = { projects: [], config: {}, bugs: [] };
        let activeProject = null, currentFilter = 'all', editingId = null;
        const IMPACT_MAP = { "Vital": 4, "Important": 3, "OK": 2, "Optimisation": 1 };
        const ICONS = { "Widescreen": "🖥️", "Desktop": "💻", "Tablet": "📟", "Mobile (L)": "📱", "Mobile": "🤳" };

        async function init() {
            try {
                const resp = await fetch(SCRIPT_URL);
                store = await resp.json();
                document.getElementById('initialProjectSelect').innerHTML = '<option value="">Choisir Projet</option>' + store.projects.map(p => `<option value="${p.name}">${p.client} — ${p.name}</option>`).join('');
                store.config.breakpoints.forEach(bp => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-4 py-2.5 rounded-lg text-[10px] font-bold text-slate-400 hover:bg-slate-50 transition-all uppercase tracking-widest";
                    btn.id = `tab-${bp}`; btn.innerHTML = `${ICONS[bp] || '🌐'} ${bp}`;
                    btn.onclick = () => filterByBreakpoint(bp);
                    document.getElementById('breakpointTabs').appendChild(btn);
                });
                document.getElementById('btn-enter').disabled = false;
                document.getElementById('btn-enter').classList.remove('opacity-50');
            } catch (err) { console.error(err); }
        }

        function filterByBreakpoint(bp) {
            currentFilter = bp;
            document.querySelectorAll('#breakpointTabs button').forEach(b => b.classList.remove('tab-active', 'text-[#6432c9]'));
            document.getElementById(`tab-${bp}`).classList.add('tab-active');
            renderBugList();
        }

        function enterDashboard() {
            const pName = document.getElementById('initialProjectSelect').value;
            if (!pName) return;
            activeProject = store.projects.find(p => p.name === pName);
            document.getElementById('view-landing').style.display = 'none';
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('currentProjectTitle').innerText = activeProject.name;
            renderBugList();
        }

        function renderBugList() {
            const sortBy = document.getElementById('sortSelect').value;
            let bugs = store.bugs.filter(b => b.Project === activeProject.name);
            if (currentFilter !== 'all') bugs = bugs.filter(b => b.Breakpoint && b.Breakpoint.includes(currentFilter));
            bugs.sort((a, b) => sortBy === 'Impact' ? (IMPACT_MAP[b.Impact] || 0) - (IMPACT_MAP[a.Impact] || 0) : b.ID.localeCompare(a.ID));

            document.getElementById('bugListContainer').innerHTML = bugs.map(bug => {
                const isSolved = bug.State === 'Solved', isClient = (bug['Noticed By'] || bug.NoticedBy || "").toUpperCase() === "CLIENT";
                const dot = isSolved ? 'dot-solved' : 'dot-' + (bug.Impact || "ok").toLowerCase().split(' ')[0];
                const id = bug['Screenshot URL'], thumb = (id && id !== "No Image") ? `https://drive.google.com/thumbnail?id=${id.includes('id=') ? id.split('id=')[1].split('&')[0] : id.split('/d/')[1].split('/')[0]}&sz=400` : null;

                return `<div class="bug-row p-4 flex items-center gap-8 ${isSolved ? 'opacity-30' : ''}">
                    <div class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${dot}"></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-4 mb-1">
                            <span class="text-[9px] font-bold text-slate-300 uppercase">${bug.ID}</span>
                            ${isClient ? `<span class="bg-amber-50 text-amber-600 text-[8px] font-bold px-1.5 py-0.5 rounded border border-amber-100 uppercase tracking-widest">Client</span>` : ''}
                            <span class="text-[#6432c9] bg-indigo-50 text-[8px] font-bold px-1.5 py-0.5 rounded uppercase tracking-widest">${bug.Location || 'GÉNÉRAL'}</span>
                            <span class="text-[9px] text-slate-300 font-bold ml-auto">${bug.Timestamp || bug.timestamp || '--:--'}</span>
                        </div>
                        <p class="text-[13px] font-medium text-slate-500 truncate">${bug.Note || 'Sans note'}</p>
                    </div>
                    <div class="flex items-center gap-12 flex-shrink-0">
                        <div class="text-lg flex gap-10 opacity-60">${(bug.Breakpoint || "").split(',').map(bp => ICONS[bp.trim()] || "").join('')}</div>
                        <div class="w-11 h-11 relative">${thumb ? `<img src="${thumb}" onclick="window.open('${id}', '_blank')" class="thumb-zoom shadow-sm">` : `<div class="w-full h-full rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-[7px] font-bold text-slate-200">∅</div>`}</div>
                        <div class="flex gap-1">
                            <button onclick="openEdit('${bug.ID}')" class="p-2 text-slate-200 hover:text-blue-500 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round"/></svg></button>
                            <button onclick="solveBug('${bug.ID}')" class="p-2 text-slate-200 hover:text-green-500 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                            <button onclick="deleteBug('${bug.ID}')" class="p-2 text-slate-200 hover:text-red-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round"/></svg></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function openEdit(id) { editingId = id; toggleOverlay(true, store.bugs.find(b => b.ID === id)); }

        function toggleOverlay(show, bug = null) {
            if (show) {
                const impacts = store.config.impacts.map(i => `<option ${bug && bug.Impact === i ? 'selected' : ''}>${i}</option>`).join('');
                const priorities = store.config.priorities.map(p => `<option ${bug && bug.Priority === p ? 'selected' : ''}>${p}</option>`).join('');
                document.getElementById('formContent').innerHTML = `
                    <div class="grid grid-cols-2 gap-4"><div class="space-y-1"><label class="label-track">Impact</label><select id="impactSelect" class="w-full border border-slate-200 p-3 rounded-xl font-bold text-[10px] bg-slate-50 outline-none">${impacts}</select></div><div class="space-y-1"><label class="label-track">Timing</label><select id="prioritySelect" class="w-full border border-slate-200 p-3 rounded-xl font-bold text-[10px] bg-slate-50 outline-none">${priorities}</select></div></div>
                    <div class="space-y-1.5"><label class="label-track">Zone</label><div class="grid grid-cols-2 gap-2">${activeProject.composition.map(c => `<label class="flex items-center gap-2.5 p-3.5 border border-slate-100 rounded-xl text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:bg-slate-50 has-[:checked]:bg-indigo-50 transition-all"><input type="checkbox" name="location" value="${c}" class="w-3.5 h-3.5 text-[#6432c9]" ${bug && bug.Location.includes(c) ? 'checked' : ''}> ${c}</label>`).join('')}</div></div>
                    <div class="space-y-1.5"><label class="label-track">Breakpoints</label><div class="flex flex-wrap gap-2">${store.config.breakpoints.map(b => `<label class="flex items-center gap-2.5 p-3.5 border border-slate-100 rounded-xl text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:bg-slate-50 has-[:checked]:bg-black has-[:checked]:text-white transition-all"><input type="checkbox" name="breakpoint" value="${b}" class="hidden" ${bug && bug.Breakpoint.includes(b) ? 'checked' : ''}> ${ICONS[b] || ''} ${b}</label>`).join('')}</div></div>
                    <textarea id="bugNote" class="w-full border border-slate-200 p-5 rounded-2xl h-28 focus:border-[#6432c9] outline-none bg-slate-50 font-medium text-xs" placeholder="Détails...">${bug ? bug.Note : ''}</textarea>
                    ${!bug ? `<div class="space-y-1"><label class="label-track">Capture</label><input type="file" id="screenshot" accept="image/*" class="w-full border border-slate-200 p-5 rounded-xl text-[9px] font-bold uppercase"></div>` : ''}
                    <div class="flex gap-2">${["Client", "Collaborateur", "LTDA"].map(n => `<label class="flex-1 text-center p-3.5 border border-slate-100 rounded-xl text-[9px] font-bold uppercase tracking-widest cursor-pointer has-[:checked]:bg-[#6432c9] has-[:checked]:text-white transition-all"><input type="radio" name="noticedBy" value="${n}" class="hidden" required ${bug && (bug['Noticed By'] || bug.NoticedBy) === n ? 'checked' : (!bug && n === 'Collaborateur' ? 'checked' : '')}> ${n}</label>`).join('')}</div>`;
                document.getElementById('formTitle').innerText = bug ? "Modifier le retour" : "Nouveau Rapport";
                document.getElementById('overlay-bg').classList.remove('hidden');
                setTimeout(() => { document.getElementById('overlay').classList.add('active'); document.getElementById('overlay-bg').classList.add('opacity-100'); }, 10);
            } else {
                editingId = null;
                document.getElementById('overlay').classList.remove('active'); document.getElementById('overlay-bg').classList.remove('opacity-100');
                setTimeout(() => document.getElementById('overlay-bg').classList.add('hidden'), 300);
            }
        }

        document.getElementById('bugForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'), now = new Date();
            btn.disabled = true; btn.innerText = "Synchronisation...";
            const payload = {
                action: editingId ? "edit_bug" : "log_bug", id: editingId, Note: document.getElementById('bugNote').value,
                Location: Array.from(document.querySelectorAll('input[name="location"]:checked')).map(el => el.value).join(', '),
                Breakpoint: Array.from(document.querySelectorAll('input[name="breakpoint"]:checked')).map(el => el.value).join(', '),
                Impact: document.getElementById('impactSelect').value, Priority: document.getElementById('prioritySelect').value,
                NoticedBy: document.querySelector('input[name="noticedBy"]:checked').value, Project: activeProject.name
            };
            if (!editingId) {
                const f = document.getElementById('screenshot').files[0];
                if (f) { payload.imageBlob = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(f); }); payload.imageType = f.type; payload.imageName = f.name; }
                payload.client = activeProject.client; payload.dateNoticed = now.toLocaleDateString('fr-FR');
                // Format Optimistic UI pour correspondre au format serveur
                const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
                const dateStr = now.getDate().toString().padStart(2,'0') + "/" + (now.getMonth()+1).toString().padStart(2,'0');
                store.bugs.unshift({...payload, ID: "LTDA-...", State: "Not solved", Timestamp: dateStr + " " + timeStr, 'Noticed By': payload.NoticedBy});
            } else { Object.assign(store.bugs.find(x => x.ID === editingId), {...payload, 'Noticed By': payload.NoticedBy}); }
            renderBugList(); toggleOverlay(false);
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            btn.disabled = false; btn.innerText = "Confirmer";
        };

        async function solveBug(id) { store.bugs.find(b => b.ID === id).State = "Solved"; renderBugList(); await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "update_bug", id: id, newState: "Solved" }) }); }
        async function deleteBug(id) { store.bugs = store.bugs.filter(b => b.ID !== id); renderBugList(); await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete_bug", id: id }) }); }

        init();
    </script>
</body>
</html>
